<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">ProposalForge Streamlit interface preview</title>
  <desc id="description">A dark enterprise proposal workspace with configuration controls, RFP input, structured proposal output, and WordSpinner review.</desc>
  <rect width="1440" height="900" fill="#0f172a"/>
  <rect x="0" y="0" width="1440" height="72" fill="#111c31"/>
  <circle cx="42" cy="36" r="14" fill="#38bdf8"/>
