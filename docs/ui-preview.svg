  <text x="250" y="42" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">AI Proposal &amp; RFP Engine</text>
  <rect x="0" y="72" width="300" height="828" fill="#111c31"/>
  <text x="28" y="116" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Configuration</text>
