  <rect x="28" y="266" width="42" height="24" rx="12" fill="#2563eb"/>
  <circle cx="58" cy="278" r="8" fill="#f8fafc"/>
  <text x="82" y="283" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Humanized tone</text>
  <text x="28" y="330" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Intensity</text>
  <rect x="28" y="344" width="244" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="42" y="370" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Conversational Enterprise</text>
  <text x="28" y="430" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Company context</text>
  <rect x="28" y="444" width="244" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="42" y="470" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">Secure enterprise AI and</text>
  <text x="42" y="489" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">automation systems.</text>
  <rect x="330" y="105" width="510" height="700" rx="10" fill="#111c31" stroke="#334155"/>
  <text x="360" y="148" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">1. Input Client Requirements</text>
  <text x="360" y="190" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Client company name</text>
  <rect x="360" y="204" width="450" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="374" y="230" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14">Apex Logistics Global</text>
  <text x="360" y="284" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Paste RFP / client email</text>
  <rect x="360" y="298" width="450" height="300" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="376" y="330" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">We need an AI-assisted operations workflow</text>
  <text x="376" y="352" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">that improves visibility across our logistics network.</text>
  <text x="376" y="374" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">The pilot should demonstrate measurable gains in</text>
  <text x="376" y="396" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="13">routing efficiency and exception response time.</text>
  <text x="360" y="646" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Core focus capabilities</text>
  <rect x="360" y="662" width="190" height="32" rx="16" fill="#1d4ed8"/>
  <text x="376" y="683" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12">Agentic AI / LLMs</text>
  <rect x="360" y="704" width="250" height="32" rx="16" fill="#1d4ed8"/>
  <text x="376" y="725" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12">Data Governance &amp; Security</text>
  <rect x="360" y="756" width="450" height="48" rx="6" fill="#2563eb"/>
  <text x="520" y="786" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Generate Enterprise Proposal</text>
  <rect x="870" y="105" width="540" height="700" rx="10" fill="#111c31" stroke="#334155"/>
  <text x="900" y="148" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">2. Generated Proposal Output</text>
  <rect x="900" y="174" width="480" height="42" rx="6" fill="#14532d" stroke="#166534"/>
  <text x="916" y="200" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="13" font-weight="700">Proposal generated successfully</text>
  <rect x="900" y="238" width="480" height="150" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="920" y="268" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="13" font-weight="700">WordSpinner review</text>
  <text x="920" y="296" fill="#fca5a5" font-family="Arial, sans-serif" font-size="12">- leverage best-in-class synergies</text>
  <text x="920" y="320" fill="#86efac" font-family="Arial, sans-serif" font-size="12">+ coordinate a practical pilot</text>
  <text x="920" y="352" fill="#64748b" font-family="Arial, sans-serif" font-size="11">3 flagged occurrences · review before delivery</text>
  <text x="900" y="432" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Final proposal</text>
  <rect x="900" y="446" width="480" height="238" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="920" y="478" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="700">Problem Breakdown &amp; Executive Summary</text>
  <text x="920" y="510" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">Apex Logistics Global is seeking a governed way to improve</text>
  <text x="920" y="532" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">routing visibility and accelerate exception response.</text>
  <text x="920" y="574" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" font-weight="700">Proposed Solution</text>
  <text x="920" y="606" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">A focused four-week pilot connects operational events,</text>
  <text x="920" y="628" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">agentic triage, and human approval checkpoints.</text>
  <rect x="900" y="714" width="480" height="48" rx="6" fill="#1d4ed8"/>
  <text x="1060" y="744" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Download Proposal (.docx)</text>
</svg>
